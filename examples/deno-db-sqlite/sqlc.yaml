version: "2"
plugins:
- name: ts
  wasm:
    url: file://../plugin.wasm
sql:
- schema: "../authors/sqlite/schema.sql"
  queries: "../authors/sqlite/query.sql"
  engine: sqlite
  codegen:
  - plugin: ts
    out: src/db
    options:
      runtime: deno
      driver: "@db/sqlite"
- schema: "tests/fixtures/schema.sql"
  queries: "tests/fixtures/query.sql"
  engine: sqlite
  codegen:
  - plugin: ts
    out: tests/db
    options:
      runtime: deno
      driver: "jsr:@db/sqlite"
